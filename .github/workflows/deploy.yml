name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ cfat_yrRswneQuGxRPLseMu1YdNlL6NFEyjubRzu3YpKZ51f3c6b4 }}
          accountId: ${{ 814c08124c28e6d94e3c482f018c01f1 }}
          command: deploy
          secrets: |
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
        env:
          VITE_SUPABASE_URL: ${{ https://cjsfpsbtohwgqwgtcjef.supabase.co }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ sb_publishable_Kg0IzMwaTIVLG9xT9aw2pw_xK0DR0gz }}
